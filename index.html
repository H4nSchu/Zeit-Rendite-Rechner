<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeit-Rendite-Rechner</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            },
            neonBlue: '#00f3ff'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
    /* Hide number input arrows */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    
    .input-ghost {
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      font-weight: bold;
      text-align: right;
      width: 90px;
      padding: 0 4px;
      border-radius: 4px;
    }
    .input-ghost:focus {
      outline: none;
      border: 1px solid #34d399;
      background: #1f2937;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const InfoIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="inline-block ml-1 text-gray-400 hover:text-gray-200 transition-colors">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    );

    const NumberAnimation = ({ value }) => {
      const [displayValue, setDisplayValue] = useState(0);
      
      useEffect(() => {
        const duration = 500;
        const frames = 30;
        const step = (value - displayValue) / frames;
        let currentFrame = 0;
        
        const interval = setInterval(() => {
          currentFrame++;
          setDisplayValue(prev => {
            const next = prev + step;
            return currentFrame >= frames ? value : next;
          });
          if (currentFrame >= frames) clearInterval(interval);
        }, duration / frames);
        
        return () => clearInterval(interval);
      }, [value]);

      return <span>{Math.round(displayValue)}</span>;
    };

    const SavingsMatrix = ({ startKapital, sparrate, ansparRendite, entnahmeRendite, jahreslohn, aktuelleStunden, wochen, steuern }) => {
      // 1. Calculate added capital in each timeframe (Wachstum passiert mit AnsparRendite)
      const addedYear = startKapital * (ansparRendite/100) + sparrate * 12;
      const addedMonth = startKapital * (ansparRendite/100/12) + sparrate;
      const addedWeek = startKapital * (ansparRendite/100/52) + (sparrate * 12 / 52);
      const addedDay = startKapital * (ansparRendite/100/260) + (sparrate * 12 / 260); // 260 work days/year
      
      const getMatrix = (addedCap) => {
        // Annual interest generated by this new capital (berechnet mit EntnahmeRendite!)
        let additionalAnnualInt = addedCap * (entnahmeRendite/100);
        if (steuern) {
           additionalAnnualInt *= (1 - 0.26375);
        }
        
        // Fraction of work saved
        const f = jahreslohn > 0 ? (additionalAnnualInt / jahreslohn) : 0;
        
        const hYear = f * (wochen * aktuelleStunden);
        const hMonth = hYear / 12;
        const hWeek = f * aktuelleStunden;
        const hDay = hWeek / 5;
        
        const fmt = (h) => {
          const hours = Math.floor(h);
          const mins = Math.floor((h - hours) * 60);
          const secs = Math.round((((h - hours) * 60) - mins) * 60);
          if (hours > 0) return `<span class="font-bold text-white">${hours}</span><span class="text-xs text-gray-500 ml-1 mr-2">h</span><span class="font-bold text-white">${mins}</span><span class="text-xs text-gray-500 ml-1">m</span>`;
          if (mins > 0) return `<span class="font-bold text-white">${mins}</span><span class="text-xs text-gray-500 ml-1 mr-2">m</span><span class="font-bold text-white">${secs}</span><span class="text-xs text-gray-500 ml-1">s</span>`;
          return `<span class="font-bold text-white">${secs}</span><span class="text-xs text-gray-500 ml-1">s</span>`;
        };
        
        return [fmt(hYear), fmt(hMonth), fmt(hWeek), fmt(hDay)];
      };
      
      const data = [
        { title: "Dieses Jahr", val: addedYear, res: getMatrix(addedYear) },
        { title: "Diesen Monat", val: addedMonth, res: getMatrix(addedMonth) },
        { title: "Diese Woche", val: addedWeek, res: getMatrix(addedWeek) },
        { title: "Heute (Arbeitstag)", val: addedDay, res: getMatrix(addedDay) }
      ];
      
      return (
        <div className="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700/50 overflow-hidden">
          <h3 className="text-xl font-bold text-white mb-2 flex items-center">
            <svg className="w-5 h-5 mr-2 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>
            Was dir dein Zuwachs exakt bringt
          </h3>
          <p className="text-sm text-gray-400 mb-6">Für jeden Zeitraum siehst du, wie viel Kapital dazukommt (Zinsen + Sparrate) und wie viel Arbeitszeit dir dieses neue Kapital ab sofort <b>dauerhaft</b> erspart.</p>
          
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            {data.map((item, idx) => (
              <div key={idx} className="bg-gray-900/50 rounded-xl p-4 border border-gray-700 hover:border-emerald-500/30 transition-colors">
                <div className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">{item.title} angespart</div>
                <div className="text-xl font-bold text-emerald-400 mb-4">+{Math.round(item.val).toLocaleString('de-DE')} €</div>
                
                <div className="space-y-3">
                  <div className="flex justify-between items-center border-b border-gray-800 pb-1">
                    <span className="text-xs text-gray-400">Pro Jahr:</span>
                    <span dangerouslySetInnerHTML={{__html: item.res[0]}}></span>
                  </div>
                  <div className="flex justify-between items-center border-b border-gray-800 pb-1">
                    <span className="text-xs text-gray-400">Pro Monat:</span>
                    <span dangerouslySetInnerHTML={{__html: item.res[1]}}></span>
                  </div>
                  <div className="flex justify-between items-center border-b border-gray-800 pb-1">
                    <span className="text-xs text-gray-400">Pro Woche:</span>
                    <span dangerouslySetInnerHTML={{__html: item.res[2]}}></span>
                  </div>
                  <div className="flex justify-between items-center">
                    <span className="text-xs text-gray-400">Pro Tag:</span>
                    <span dangerouslySetInnerHTML={{__html: item.res[3]}}></span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // Chart Components wrapping Chart.js
    const AreaChart = ({ data }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }
        if (!chartRef.current) return;

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new window.Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.name),
            datasets: [
              {
                label: 'Aus Startkapital (h/Woche)',
                data: data.map(d => d.Basis),
                borderColor: '#34d399',
                backgroundColor: 'rgba(52, 211, 153, 0.4)',
                fill: true,
                tension: 0.4,
                pointRadius: 0,
                pointHitRadius: 10
              },
              {
                label: 'Aus Sparplan (h/Woche)',
                data: data.map(d => d.Sparplan),
                borderColor: '#059669',
                backgroundColor: 'rgba(5, 150, 105, 0.4)',
                fill: true,
                tension: 0.4,
                pointRadius: 0,
                pointHitRadius: 10
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { 
                stacked: true, 
                grid: { color: '#374151' }, 
                ticks: { color: '#9ca3af' },
                title: { display: true, text: 'Ersparte h / Woche', color: '#9ca3af' }
              },
              x: { 
                grid: { display: false }, 
                ticks: { 
                  color: '#9ca3af',
                  maxTicksLimit: 10
                } 
              }
            },
            plugins: {
              legend: { labels: { color: '#fff' } },
              tooltip: { mode: 'index', intersect: false }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [data]);

      return <canvas ref={chartRef}></canvas>;
    };

    const BoostChart = ({ data }) => {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }
        if (!chartRef.current) return;

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new window.Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.map(d => d.name),
            datasets: [
              {
                label: 'Sekunden pro Woche weniger arbeiten',
                data: data.map(d => d.ZeitBoost),
                backgroundColor: '#00f3ff',
                borderRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { 
                grid: { color: '#374151' }, 
                ticks: { color: '#9ca3af' },
                title: { display: true, text: 'Zuwachs an Freizeit (Sekunden/Woche)', color: '#9ca3af' }
              },
              x: { 
                grid: { display: false }, 
                ticks: { 
                  color: '#9ca3af',
                  maxTicksLimit: 10
                } 
              }
            },
            plugins: {
              legend: { labels: { color: '#fff' }, display: false },
              tooltip: { 
                mode: 'index', 
                intersect: false,
                callbacks: {
                  label: function(context) {
                    let val = context.raw;
                    let m = Math.floor(val / 60);
                    let s = Math.round(val % 60);
                    if (m > 0) return "Zuwachs pro Woche: " + m + " Min " + s + " Sek";
                    return "Zuwachs pro Woche: " + s + " Sek";
                  }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [data]);

      return <canvas ref={chartRef}></canvas>;
    };

    const App = () => {
      const [startKapital, setStartKapital] = useState(65000);
      const [sparrate, setSparrate] = useState(1000);
      const [ansparRendite, setAnsparRendite] = useState(6.0);
      const [entnahmeRendite, setEntnahmeRendite] = useState(3.5);
      
      const [jahreslohn, setJahreslohn] = useState(40000);
      const [urlaubstage, setUrlaubstage] = useState(30);
      const [steuern, setSteuern] = useState(false);

      const [aktuelleStunden, setAktuelleStunden] = useState(40);
      const [zielStunden, setZielStunden] = useState(20);

      const maxJahre = 25;

      const wochen = Math.max(1, (260 - urlaubstage - 10) / 5);
      const berechneterStundenlohn = jahreslohn / (wochen * aktuelleStunden);

      const calculateInterest = (kapital, r, t) => {
        let interest = kapital * (r / 100);
        if (t) {
          let taxable = Math.max(0, interest - 1000);
          interest -= taxable * 0.26375;
        }
        return interest;
      };

      const getWeeklyTime = (interest) => {
        if (jahreslohn <= 0) return 0;
        return (interest / jahreslohn) * aktuelleStunden;
      };

      const decimalToTime = (decimalHours) => {
        const hours = Math.floor(decimalHours);
        const minutes = Math.floor((decimalHours - hours) * 60);
        const seconds = Math.floor((((decimalHours - hours) * 60) - minutes) * 60);
        return { hours, minutes, seconds };
      };

      const currentInterest = calculateInterest(startKapital, entnahmeRendite, steuern);
      const currentDecimalTime = getWeeklyTime(currentInterest);
      const currentFormattedTime = decimalToTime(currentDecimalTime);

      const chartData = useMemo(() => {
        const data = [];
        let currentBasis = startKapital;
        let currentSpar = 0;
        
        for (let year = 1; year <= maxJahre; year++) {
          for (let m = 0; m < 12; m++) {
            currentBasis += currentBasis * (ansparRendite / 100 / 12);
            currentSpar += currentSpar * (ansparRendite / 100 / 12) + sparrate;
          }
          
          const nextBasisInt = currentBasis * (entnahmeRendite / 100);
          const nextSparInt = currentSpar * (entnahmeRendite / 100);
          const totalInt = nextBasisInt + nextSparInt;
          
          let taxRatio = 0;
          if (steuern && totalInt > 0) {
            const taxes = Math.max(0, totalInt - 1000) * 0.26375;
            taxRatio = taxes / totalInt;
          }
          
          const netBasisInt = nextBasisInt * (1 - taxRatio);
          const netSparInt = nextSparInt * (1 - taxRatio);
          
          const basisHours = getWeeklyTime(netBasisInt);
          const sparHours = getWeeklyTime(netSparInt);
          
          const totalKapital = currentBasis + currentSpar;
          const wRate = ansparRendite / 100 / 52;
          const wSpar = (sparrate * 12) / 52;
          const weeklyAdded = (totalKapital * wRate) + wSpar;
          const additionalInt = weeklyAdded * (entnahmeRendite / 100);
          const boostHours = getWeeklyTime(additionalInt);
          const boostSeconds = boostHours * 3600;
          
          data.push({
            name: `Jahr ${year}`,
            Basis: parseFloat(basisHours.toFixed(2)),
            Sparplan: parseFloat(sparHours.toFixed(2)),
            Gesamt: parseFloat((basisHours + sparHours).toFixed(2)),
            ZeitBoost: parseFloat(boostSeconds.toFixed(2))
          });
        }
        return data;
      }, [startKapital, sparrate, ansparRendite, entnahmeRendite, jahreslohn, aktuelleStunden, steuern]);

      const zielErsparnis = Math.max(0, aktuelleStunden - zielStunden);
      const exactMilestoneYear = useMemo(() => {
        if (zielErsparnis <= 0) return 0;
        if (currentDecimalTime >= zielErsparnis) return 0;
        if (sparrate === 0 && startKapital === 0) return -1;
        if (sparrate === 0 && ansparRendite === 0 && entnahmeRendite === 0) return -1;
        
        let kBasis = startKapital;
        let kSpar = 0;
        let year = 0;
        while (year <= 100) {
          const nextBasisInt = kBasis * (entnahmeRendite / 100);
          const nextSparInt = kSpar * (entnahmeRendite / 100);
          const totalInt = nextBasisInt + nextSparInt;
          
          let netTotalInt = totalInt;
          if (steuern) {
            const taxes = Math.max(0, totalInt - 1000) * 0.26375;
            netTotalInt -= taxes;
          }
          
          const curErsparnis = getWeeklyTime(netTotalInt);
          if (curErsparnis >= zielErsparnis) {
            return year;
          }
          
          year++;
          for (let m = 0; m < 12; m++) {
            kBasis += kBasis * (ansparRendite / 100 / 12);
            kSpar += kSpar * (ansparRendite / 100 / 12) + sparrate;
          }
        }
        return -1;
      }, [startKapital, sparrate, ansparRendite, entnahmeRendite, jahreslohn, aktuelleStunden, zielErsparnis, steuern, currentDecimalTime]);

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 pb-16">
          <div className="text-center space-y-4 py-8">
            <h1 className="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-neonBlue">
              Zeit-Rendite-Rechner
            </h1>
            <p className="text-lg text-gray-400 max-w-2xl mx-auto">
              Berechne, wie viel deiner <strong className="text-emerald-400">wöchentlichen Arbeitszeit</strong> du dir durch passives Einkommen aus Kapital und Sparplänen zurückkaufst.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-4 space-y-8">
              {/* Hauptparameter */}
              <div className="bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700/50 space-y-6">
                <h2 className="text-xl font-bold text-white mb-6 flex items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mr-2 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                  </svg>
                  Kapital & Rendite
                </h2>
                
                <div className="space-y-6">
                  <div>
                    <label className="flex justify-between items-center text-sm font-medium text-gray-300 mb-2 group">
                      <span className="cursor-help" title="Dein aktuell investiertes Kapital">Startkapital <InfoIcon /></span>
                      <div className="flex items-center text-emerald-400 font-bold bg-gray-900 rounded px-1">
                        <input type="number" value={startKapital} onChange={(e) => setStartKapital(Number(e.target.value))} className="input-ghost" />
                        <span>€</span>
                      </div>
                    </label>
                    <input type="range" min="0" max="500000" step="1000" value={startKapital} onChange={(e) => setStartKapital(Number(e.target.value))} className="w-full accent-emerald-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                  </div>

                  <div>
                    <label className="flex justify-between items-center text-sm font-medium text-gray-300 mb-2 group">
                      <span className="cursor-help" title="Wie viel du jeden Monat zusätzlich investierst">Mtl. Sparrate <InfoIcon /></span>
                      <div className="flex items-center text-emerald-400 font-bold bg-gray-900 rounded px-1">
                        <input type="number" value={sparrate} onChange={(e) => setSparrate(Number(e.target.value))} className="input-ghost" />
                        <span>€</span>
                      </div>
                    </label>
                    <input type="range" min="0" max="5000" step="50" value={sparrate} onChange={(e) => setSparrate(Number(e.target.value))} className="w-full accent-emerald-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                  </div>

                  <div>
                    <label className="flex justify-between items-center text-sm font-medium text-gray-300 mb-2 group">
                      <span className="cursor-help" title="Wachstumsrendite des Depots (z.B. ETF) pro Jahr">Anspar-Rendite <InfoIcon /></span>
                      <div className="flex items-center text-emerald-400 font-bold bg-gray-900 rounded px-1">
                        <input type="number" step="0.1" value={ansparRendite} onChange={(e) => setAnsparRendite(Number(e.target.value))} className="input-ghost" style={{width: '60px'}} />
                        <span>%</span>
                      </div>
                    </label>
                    <input type="range" min="1" max="15" step="0.1" value={ansparRendite} onChange={(e) => setAnsparRendite(Number(e.target.value))} className="w-full accent-emerald-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                  </div>
                  
                  <div className="border-t border-gray-700 pt-4 mt-2">
                    <label className="flex justify-between items-center text-sm font-medium text-gray-300 mb-2 group">
                      <span className="cursor-help" title="Sichere Entnahmerate oder Dividendenrendite (woraus sich die Freizeit berechnet)">Entnahme-Rendite <InfoIcon /></span>
                      <div className="flex items-center text-neonBlue font-bold bg-gray-900 rounded px-1">
                        <input type="number" step="0.1" value={entnahmeRendite} onChange={(e) => setEntnahmeRendite(Number(e.target.value))} className="input-ghost focus:border-neonBlue text-neonBlue" style={{width: '60px'}} />
                        <span>%</span>
                      </div>
                    </label>
                    <input type="range" min="1" max="10" step="0.1" value={entnahmeRendite} onChange={(e) => setEntnahmeRendite(Number(e.target.value))} className="w-full accent-neonBlue h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                  </div>

                  <div className="pt-2 flex items-center justify-between">
                    <label className="text-sm font-medium text-gray-300 cursor-pointer flex items-center" htmlFor="steuernToggle">
                      Steuern berücksichtigen
                      <span className="ml-1 cursor-help" title="1000€ Freibetrag, danach 26,375% Abgeltungssteuer inkl. Soli"><InfoIcon /></span>
                    </label>
                    <button 
                      id="steuernToggle"
                      onClick={() => setSteuern(!steuern)} 
                      className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${steuern ? 'bg-emerald-500' : 'bg-gray-600'}`}
                    >
                      <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${steuern ? 'translate-x-6' : 'translate-x-1'}`} />
                    </button>
                  </div>
                </div>
              </div>

              {/* Arbeit & Ziel */}
              <div className="bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700/50 space-y-6">
                <h2 className="text-xl font-bold text-white mb-6 flex items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 mr-2 text-neonBlue" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                  Arbeit & Ziele
                </h2>

                <div className="space-y-5">
                  <div>
                    <label className="flex justify-between text-sm font-medium text-gray-300 mb-1 group">
                      <span className="cursor-help" title="Dein Netto-Jahreslohn nach Steuern">Netto-Jahreslohn <InfoIcon /></span>
                    </label>
                    <div className="relative">
                      <input type="number" min="1" value={jahreslohn} onChange={(e) => setJahreslohn(Number(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded-lg py-2 px-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
                      <span className="absolute right-3 top-2 text-gray-400">€</span>
                    </div>
                    <p className="text-xs text-gray-500 mt-1">Das entspricht bei {aktuelleStunden}h ca. {berechneterStundenlohn.toFixed(2)} € pro Stunde.</p>
                  </div>

                  <div>
                    <label className="flex justify-between text-sm font-medium text-gray-300 mb-1 group">
                      <span className="cursor-help" title="Wie viele Urlaubstage du hast (wir ziehen diese und ca. 10 Feiertage von 260 Arbeitstagen ab)">Urlaubstage pro Jahr <InfoIcon /></span>
                    </label>
                    <div className="relative">
                      <input type="number" min="0" max="100" value={urlaubstage} onChange={(e) => setUrlaubstage(Number(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded-lg py-2 px-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500" />
                      <span className="absolute right-3 top-2 text-gray-400">Tage</span>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-gray-700">
                    <label className="flex justify-between text-sm font-medium text-gray-300 mb-3 mt-2 group">
                      <span className="text-neonBlue">Dein Ziel (Teilzeit)</span>
                    </label>
                    <div className="flex gap-2">
                      <div className="w-1/2">
                        <span className="text-xs text-gray-400 mb-1 block">Aktuell</span>
                        <div className="relative">
                          <input type="number" min="1" value={aktuelleStunden} onChange={(e) => setAktuelleStunden(Number(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded-lg py-2 px-2 text-white font-bold focus:outline-none focus:border-neonBlue focus:ring-1 focus:ring-neonBlue" />
                          <span className="absolute right-2 top-2 text-gray-400 text-sm">h/Wo</span>
                        </div>
                      </div>
                      <div className="w-1/2">
                        <span className="text-xs text-gray-400 mb-1 block">Wunsch</span>
                        <div className="relative">
                          <input type="number" min="0" value={zielStunden} onChange={(e) => setZielStunden(Number(e.target.value))} className="w-full bg-gray-900 border border-gray-600 rounded-lg py-2 px-2 text-white font-bold focus:outline-none focus:border-neonBlue focus:ring-1 focus:ring-neonBlue" />
                          <span className="absolute right-2 top-2 text-gray-400 text-sm">h/Wo</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div className="lg:col-span-8 space-y-8">
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-gray-800 p-6 rounded-2xl shadow-xl border border-emerald-500/20 relative overflow-hidden group hover:border-emerald-500/50 transition-colors flex flex-col justify-between">
                  <div className="absolute -right-6 -top-6 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all"></div>
                  <h3 className="text-sm text-gray-400 font-semibold mb-2 flex items-center">
                    <svg className="w-4 h-4 mr-1 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Bereits freigekauft
                  </h3>
                  <div className="text-2xl font-bold text-white mb-1">
                    <NumberAnimation value={currentFormattedTime.hours} /> <span className="text-lg text-emerald-400">h</span>{' '}
                    <NumberAnimation value={currentFormattedTime.minutes} /> <span className="text-lg text-emerald-400">m</span>{' '}
                    <NumberAnimation value={currentFormattedTime.seconds} /> <span className="text-lg text-emerald-400">s</span>
                  </div>
                  <p className="text-xs text-gray-500 mt-2">Diese Zeit sparst du dir aktuell <b>pro Woche</b> an Arbeitszeit.</p>
                </div>

                <div className="bg-gray-800 p-6 rounded-2xl shadow-xl border border-purple-500/20 relative overflow-hidden group hover:border-purple-500/50 transition-colors flex flex-col justify-between">
                  <div className="absolute -right-6 -top-6 w-24 h-24 bg-purple-500/10 rounded-full blur-xl group-hover:bg-purple-500/20 transition-all"></div>
                  <h3 className="text-sm text-gray-400 font-semibold mb-2 flex items-center">
                    <svg className="w-4 h-4 mr-1 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
                    Ziel ({zielStunden}h) in
                  </h3>
                  <div className="text-2xl font-bold text-white mb-1">
                    {exactMilestoneYear === 0 ? (
                      <span className="text-purple-400 text-xl">Jetzt!</span>
                    ) : exactMilestoneYear > 0 ? (
                      <React.Fragment><NumberAnimation value={exactMilestoneYear} /> <span className="text-lg text-purple-400">Jahren</span></React.Fragment>
                    ) : (
                      <span className="text-purple-400 text-xl">Nie</span>
                    )}
                  </div>
                  <p className="text-xs text-gray-500 mt-2">In dieser Zeit hast du genug passives Einkommen, um <b>{zielErsparnis}h pro Woche</b> weniger zu arbeiten.</p>
                </div>
              </div>

              <SavingsMatrix 
                startKapital={startKapital} 
                sparrate={sparrate} 
                ansparRendite={ansparRendite} 
                entnahmeRendite={entnahmeRendite} 
                jahreslohn={jahreslohn} 
                aktuelleStunden={aktuelleStunden} 
                wochen={wochen} 
                steuern={steuern} 
              />

              <div className="grid grid-cols-1 gap-8">
                <div className="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700/50">
                  <h3 className="text-lg font-bold text-white mb-4">Wie viel Arbeitszeit du pro Woche sparst</h3>
                  <div className="h-72 w-full relative">
                    <AreaChart data={chartData} />
                  </div>
                </div>

                <div className="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700/50">
                  <h3 className="text-lg font-bold text-white mb-2">Der Schneeballeffekt: Jede Woche kaufst du dir mehr Zeit</h3>
                  <p className="text-sm text-gray-400 mb-4">Dieses Diagramm zeigt dir, wie viele Minuten/Sekunden du dir <b>pro Woche</b> freikaufst, bedingt durch den wöchentlichen Zuwachs (Sparrate + Zinseszins).</p>
                  <div className="h-64 w-full relative">
                    <BoostChart data={chartData} />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
